# 부스 노트북용 Windows 실행 파일(PasswordGuardian.exe)을 만든다.
# 결과: 이 작업 페이지 아래 Artifacts의 'PasswordGuardian-windows' (압축을 풀면 PasswordGuardian 폴더)
# 부스 런처에서는 PasswordGuardian.exe --booth 로 실행한다(전체 화면은 기본값).
name: Windows 실행 파일 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 실행 파일 만들기
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build PasswordGuardian.spec

      - name: 결과 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\PasswordGuardian\PasswordGuardian.exe")) { throw "PasswordGuardian.exe가 만들어지지 않았습니다" }
          Get-ChildItem "dist\PasswordGuardian" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordGuardian-windows
          path: dist/PasswordGuardian
          retention-days: 30
